<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Baseball Controller (Orientation)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            height: 100vh;
            text-align: center; 
            overscroll-behavior: none; 
        }
        .status {
            padding: 12px 25px; 
            border-radius: 25px; 
            margin: 15px 0; 
            font-weight: bold;
            font-size: 1.1em; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .connected { background: #4CAF50; color: white; } 
        .disconnected { background: #F44336; color: white; } 
        .data-container {
            background: white;
            padding: 20px;
            border-radius: 12px; 
            margin-top: 20px;
            width: 90%;
            max-width: 350px; /* Wider for more data */
            box-shadow: 0 4px 8px rgba(0,0,0,0.15); 
        }
        .data-item {
            margin-bottom: 10px; 
            font-size: 0.90em; /* Slightly smaller to fit more */
            text-align: left;
        }
        .data-item strong {
            color: #333;
            display: inline-block;
            width: 120px; /* Align labels */
        }
        button#calibrate, button#permissionButton {
            background: #007AFF; 
            color: white;
            border: none;
            padding: 18px 35px; 
            border-radius: 30px; 
            font-size: 1.1em; /* Slightly smaller button text */
            margin-top: 20px; 
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button#calibrate:hover, button#permissionButton:hover {
            background: #005ecb; 
        }
        button#calibrate:disabled { 
            background: #cccccc;
            cursor: not-allowed;
        }
        .calibrating-text { 
            color: #007AFF;
            font-weight: bold;
            margin-top: 10px;
            height: 20px; 
        }
        #permissionButton {
            background-color: #FF9500; 
        }
        #permissionButton:hover {
            background-color: #cc7a00;
        }
    </style>
</head>
<body>
    <h1>Orientation Controller</h1>
    <div id="status" class="status disconnected">Disconnected</div>
    
    <button id="permissionButton">Enable Motion Sensors</button>
    <button id="calibrate" style="display: none;">Set Neutral Bat Pose</button>
    <div id="feedbackStatus" class="calibrating-text">&nbsp;</div>

    <div class="data-container" style="display: none;">
        <div class="data-item"><strong>Raw Alpha (Z):</strong> <span id="raw_alpha">0</span>&deg;</div>
        <div class="data-item"><strong>Raw Beta (X):</strong> <span id="raw_beta">0</span>&deg;</div>
        <div class="data-item"><strong>Raw Gamma (Y):</strong> <span id="raw_gamma">0</span>&deg;</div>
        <hr>
        <div class="data-item"><strong>Rel. Alpha:</strong> <span id="rel_alpha">0</span>&deg;</div>
        <div class="data-item"><strong>Rel. Beta:</strong> <span id="rel_beta">0</span>&deg;</div>
        <div class="data-item"><strong>Rel. Gamma:</strong> <span id="rel_gamma">0</span>&deg;</div>
        <hr>
        <div class="data-item"><strong>Accel X:</strong> <span id="accel_x">0.00</span></div>
        <div class="data-item"><strong>Accel Y:</strong> <span id="accel_y">0.00</span></div>
        <div class="data-item"><strong>Accel Z:</strong> <span id="accel_z">0.00</span></div>
    </div>

    <script>
        let ws = null;
        
        let initialOrientation = { alpha: 0, beta: 0, gamma: 0, set: false };
        let currentRawOrientation = { alpha: 0, beta: 0, gamma: 0 };
        let currentAcceleration = { x: 0, y: 0, z: 0 }; 

        const statusDiv = document.getElementById('status');
        const calibrateBtn = document.getElementById('calibrate');
        const feedbackStatusDiv = document.getElementById('feedbackStatus');
        const permissionButton = document.getElementById('permissionButton');
        const dataContainer = document.querySelector('.data-container');

        const rawAlphaSpan = document.getElementById('raw_alpha');
        const rawBetaSpan = document.getElementById('raw_beta');
        const rawGammaSpan = document.getElementById('raw_gamma');
        const relAlphaSpan = document.getElementById('rel_alpha');
        const relBetaSpan = document.getElementById('rel_beta');
        const relGammaSpan = document.getElementById('rel_gamma');
        const accelXSpan = document.getElementById('accel_x');
        const accelYSpan = document.getElementById('accel_y');
        const accelZSpan = document.getElementById('accel_z');

        let orientationListenerAttached = false;
        let motionListenerAttached = false; 

        // --- Helper function to normalize angle differences ---
        function normalizeAngleDifference(diff) {
            while (diff <= -180) diff += 360;
            while (diff > 180) diff -= 360;
            return diff;
        }

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }
            const host = window.location.hostname;
            const scheme = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const port = 8765; 
            const url = `${scheme}${host}:${port}`;

            console.log(`🔗 Trying to connect to WebSocket: ${url}`);
            ws = new WebSocket(url);

            ws.onopen = () => {
                statusDiv.textContent = 'Connected';
                statusDiv.className = 'status connected';
                console.log("✅ WebSocket connected. Sending join message...");
                ws.send(JSON.stringify({ type: "controller_join" }));
                calibrateBtn.style.display = 'inline-block'; 
                dataContainer.style.display = 'block'; 
            };
            ws.onclose = (event) => {
                statusDiv.textContent = 'Disconnected';
                statusDiv.className = 'status disconnected';
                console.log(`❌ WebSocket disconnected. Code: ${event.code}, Reason: ${event.reason}`);
                calibrateBtn.style.display = 'none';
                if (event.code !== 1000 && event.code !== 1005) {
                     setTimeout(connectWebSocket, 3000);
                }
            };
            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
                statusDiv.textContent = 'Connection Error';
            };
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === "controller_ack") {
                    console.log("Controller acknowledged by server.");
                    feedbackStatusDiv.textContent = "Controller Ready. Set Neutral Pose.";
                     setTimeout(() => { feedbackStatusDiv.textContent = '\u00A0';}, 2000); 
                }
            };
        }
    
        function handleDeviceOrientation(event) {
            currentRawOrientation.alpha = event.alpha || 0;
            currentRawOrientation.beta = event.beta || 0;
            currentRawOrientation.gamma = event.gamma || 0;

            rawAlphaSpan.textContent = currentRawOrientation.alpha.toFixed(1);
            rawBetaSpan.textContent = currentRawOrientation.beta.toFixed(1);
            rawGammaSpan.textContent = currentRawOrientation.gamma.toFixed(1);

            if (!initialOrientation.set && orientationListenerAttached) { 
                setCalibration(false); 
            }
            sendData(); 
        }

        function handleDeviceMotion(event) { 
            const accel = event.accelerationIncludingGravity || event.acceleration || { x: 0, y: 0, z: 0 };
            currentAcceleration.x = accel.x || 0;
            currentAcceleration.y = accel.y || 0;
            currentAcceleration.z = accel.z || 0;
            
            accelXSpan.textContent = currentAcceleration.x.toFixed(2);
            accelYSpan.textContent = currentAcceleration.y.toFixed(2);
            accelZSpan.textContent = currentAcceleration.z.toFixed(2);
        }

        function sendData() {
            if (!initialOrientation.set) return; 

            // Calculate raw differences
            let rawRelAlpha = currentRawOrientation.alpha - initialOrientation.alpha;
            let rawRelBeta  = currentRawOrientation.beta  - initialOrientation.beta;
            let rawRelGamma = currentRawOrientation.gamma - initialOrientation.gamma;

            // --- Normalize the relative angles ---
            let relAlpha = normalizeAngleDifference(rawRelAlpha);
            let relBeta  = normalizeAngleDifference(rawRelBeta);
            let relGamma = normalizeAngleDifference(rawRelGamma);

            relAlphaSpan.textContent = relAlpha.toFixed(1);
            relBetaSpan.textContent = relBeta.toFixed(1);
            relGammaSpan.textContent = relGamma.toFixed(1);

            if (ws && ws.readyState === WebSocket.OPEN) {
                const payload = {
                    o_alpha: relAlpha,
                    o_beta: relBeta,
                    o_gamma: relGamma,
                    ax: currentAcceleration.x, 
                    ay: currentAcceleration.y,
                    az: currentAcceleration.z
                };
                ws.send(JSON.stringify(payload));
            }
        }

        function requestMotionPermission() {
            let promises = [];
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                promises.push(DeviceOrientationEvent.requestPermission());
            } else { promises.push(Promise.resolve('grantedOrNotRequired')); }

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                promises.push(DeviceMotionEvent.requestPermission());
            } else { promises.push(Promise.resolve('grantedOrNotRequired')); }
            
            Promise.all(promises).then(results => {
                const orientationPerm = results[0];
                const motionPerm = results[1];
                let grantedOrientation = false;
                let grantedMotion = false;

                if (orientationPerm === 'granted' || orientationPerm === 'grantedOrNotRequired') {
                    if (!orientationListenerAttached && typeof DeviceOrientationEvent !== 'undefined') {
                        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
                        orientationListenerAttached = true;
                        grantedOrientation = true;
                        console.log("✅ DeviceOrientation event listener added.");
                    } else if (orientationPerm === 'grantedOrNotRequired' && typeof DeviceOrientationEvent !== 'undefined'){
                         window.addEventListener('deviceorientation', handleDeviceOrientation, true);
                         orientationListenerAttached = true;
                         grantedOrientation = true;
                         console.log("✅ DeviceOrientation event listener added (no explicit permission needed).");
                    }
                }

                if (motionPerm === 'granted' || motionPerm === 'grantedOrNotRequired') {
                     if (!motionListenerAttached && typeof DeviceMotionEvent !== 'undefined') {
                        window.addEventListener('devicemotion', handleDeviceMotion, true);
                        motionListenerAttached = true;
                        grantedMotion = true;
                        console.log("✅ DeviceMotion event listener added.");
                    } else if (motionPerm === 'grantedOrNotRequired' && typeof DeviceMotionEvent !== 'undefined'){
                        window.addEventListener('devicemotion', handleDeviceMotion, true);
                        motionListenerAttached = true;
                        grantedMotion = true;
                        console.log("✅ DeviceMotion event listener added (no explicit permission needed).");
                    }
                }

                if (grantedOrientation || grantedMotion) {
                    permissionButton.style.display = 'none';
                    connectWebSocket(); 
                } else {
                     alert('Sensor access denied. Please enable motion/orientation sensors in browser settings.');
                }
            }).catch(error => {
                console.error("Error requesting permissions:", error);
                alert("Could not request permissions.");
            });
        }
    
        permissionButton.addEventListener('click', requestMotionPermission);
    
        function setCalibration(showFeedback = true) { 
            initialOrientation.alpha = currentRawOrientation.alpha;
            initialOrientation.beta  = currentRawOrientation.beta;
            initialOrientation.gamma = currentRawOrientation.gamma;
            initialOrientation.set = true;
            console.log("✅ Neutral pose calibrated:", initialOrientation);
            if (showFeedback) {
                feedbackStatusDiv.textContent = 'Neutral Pose Set!';
                setTimeout(() => { feedbackStatusDiv.textContent = '\u00A0'; }, 1500); 
            }
        }
        calibrateBtn.addEventListener('click', () => setCalibration(true));
    
        console.log("Controller script loaded. Click 'Enable Motion Sensors'.");
    </script>
</body>
</html>
